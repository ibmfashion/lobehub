name: sync-lobehub-upstream-to-codearts

# 作用: 把官方 lobehub/lobe-chat 的 main 单向同步到华为云 CodeArts main。
#       方向: GitHub 官方(只读) -> CodeArts(只写)。不回写 fork, fork 上的这份
#       workflow 文件只是让 Actions 有地方跑; 对 fork 本身零写入(无 push 权限需求,
#       permissions 只需 read)。
#
#       custom 分支只在 CodeArts, 本流程不涉及; ECS 从 CodeArts 拉取构建推 custom。
#
# 变化检测: 对比官方 main 与 CodeArts main 的 SHA(不用 upstream-mirror 标记分支,
#           避免任何对 GitHub 的写操作)。
#
# 需在本 fork(ibmfashion/lobehub) Settings -> Secrets -> Actions 配置:
#     CODEARTS_SSH_KEY  = SSH 私钥全文(含 BEGIN/END 行), 公钥已加到 CodeArts 个人设置->SSH密钥
#     CODEARTS_LOBEHUB_SSH_URL = CodeArts lobehub 仓库 SSH 地址

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # 约 15 分钟, 避开整点, 与 nmw 的错开
  repository_dispatch:
    types: [lobehub-upstream-updated]
  workflow_dispatch: {}

permissions:
  contents: read   # 只读 GitHub(不回写 fork), 不需要写权限

concurrency:
  group: sync-lobehub-mirror
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/lobehub/lobe-chat.git
  CODEARTS_SSH_HOST: codehub.devcloud.cn-east-3.huaweicloud.com
  UPSTREAM_BRANCH: main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Configure git
        run: |
          git config --global user.name  "mirror-bot"
          git config --global user.email "mirror-bot@users.noreply.github.com"

      - name: Detect upstream change
        id: detect
        run: |
          git init work && cd work
          git remote add upstream "${UPSTREAM_URL}"
          git fetch --tags upstream "${UPSTREAM_BRANCH}"
          NEW="$(git rev-parse upstream/${UPSTREAM_BRANCH})"
          OLD="$(git ls-remote "${{ secrets.CODEARTS_LOBEHUB_SSH_URL }}" refs/heads/main | awk '{print $1}')"
          echo "官方 main = ${NEW:0:12} ; CodeArts main = ${OLD:0:12}"
          if [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无新 commit, 跳过。"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "sha=$NEW"       >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH for CodeArts
        if: steps.detect.outputs.changed == 'true'
        run: |
          test -n "${{ secrets.CODEARTS_SSH_KEY }}" || { echo "❌ secret CODEARTS_SSH_KEY 未配置/为空"; exit 1; }
          test -n "${{ secrets.CODEARTS_LOBEHUB_SSH_URL }}" || { echo "❌ secret CODEARTS_LOBEHUB_SSH_URL 未配置/为空"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.CODEARTS_SSH_KEY }}" > ~/.ssh/codearts_key
          chmod 600 ~/.ssh/codearts_key
          ssh-keyscan -H "${CODEARTS_SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Push official main to Huawei CodeArts (SSH)
        if: steps.detect.outputs.changed == 'true'
        working-directory: work
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/codearts_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
        run: |
          git push --force --tags "${{ secrets.CODEARTS_LOBEHUB_SSH_URL }}" \
            "upstream/${UPSTREAM_BRANCH}:refs/heads/main"
          echo "✅ 已把官方 ${{ steps.detect.outputs.sha }} 推送到 CodeArts main"

      - name: Summary
        if: steps.detect.outputs.changed == 'true'
        run: echo "同步完成。ECS 端从 CodeArts 拉取, 合并进 custom 后构建推 SWR(只推 CodeArts, 不外泄)。"
